name: Compiler compatibility

on:
  pull_request:
    branches: ["compat/0.7"]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mix local.hex 2.5.3 --force
      - run: mix local.rebar --force
      - run: mise run audit:setup
      - run: mix deps.get
      - run: mise run ci
